</script>
<script>
(() => {
'use strict';
const KEY='washq.v4', PREF='washq.prefs', GRACE=10, CONFIRM=10, HOLD=5;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DUR=[{v:30,t:'Quick wash',d:'Lightly soiled, small loads'},{v:40,t:'Standard wash',d:'Everyday clothes, regular load'},{v:60,t:'Heavy load',d:'Bedsheets, towels, jeans, full drum'}];
const durName=v=>(DUR.find(x=>x.v===v)||{}).t||(v?'Custom duration':'');

// ---------- identity & prefs ----------
let prefs=JSON.parse(localStorage.getItem(PREF)||'{}');
if(!prefs.client)prefs.client=Math.random().toString(36).slice(2,10);
if(prefs.demo==null)prefs.demo=false;
const savePrefs=()=>localStorage.setItem(PREF,JSON.stringify(prefs));savePrefs();
const ME=prefs.client;
const MIN=()=>prefs.demo?1000:60000; // fast mode: 1 min = 1 s

// ---------- theme ----------
const sun='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(){
  const t=prefs.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=t;$('#themeBtn').innerHTML=t==='dark'?sun:moon;
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#1e1f21':'#ffffff';
}
$('#themeBtn').onclick=()=>{prefs.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';savePrefs();applyTheme();if(typeof setMood==='function')setMood()};
applyTheme();

// ---------- state ----------
function blank(id,name){return{id,name:name||('Machine '+id),state:'free',start:0,end:0,dur:0,user:'',owner:'',graceEnd:0,queue:[],hold:null}}
function reset(m){Object.assign(m,{state:'free',start:0,end:0,dur:0,user:'',owner:'',graceEnd:0,hold:null})}
// Demo starting state — realistic mock activity. Everything stays fully interactive.
const MOCK_USERS=['Aditya · C-204','Priya · C-112','Rohan · B-305','Sneha · A-118','Karan · C-220','Ishaan · B-401','Ananya · A-207','Vikram · C-315','Meera · B-108','Arjun · A-322'];
function seed(blk='C'){
  const B=BLOCKS[blk]||BLOCKS.C,N=B.n,o=B.o,now=Date.now(),MS=60000,m=Array.from({length:N},(_,i)=>blank(i+1)),log=[];
  const U=i=>MOCK_USERS[(i+o)%MOCK_USERS.length];
  const Mi=id=>blk==='C'?id:((id-1+o)%(N-1))+2;   // shuffle which machines are busy per block (never Machine 1)
  const mk=id=>m[Mi(id)-1];
  // [machine, duration, minutes elapsed, user]  — Machine 1 left free for the live sensor
  [[3,60,38,U(0)],[5,40,9,U(1)],[7,45,33,U(4)],[10,30,4,U(3)],[13,90,61,U(5)]].forEach(([id,d,el,u])=>{
    Object.assign(mk(id),{state:'busy',dur:d,start:now-el*MS,end:now+(d-el)*MS,user:u,owner:'demo'});log.push({t:now-el*MS,d,m:Mi(id)});
  });
  // cycle complete, waiting for pickup (grace period running)
  [[9,40,3,U(2)],[14,60,7,U(8)]].forEach(([id,d,sinceDone,u])=>{
    const end=now-sinceDone*MS;Object.assign(mk(id),{state:'done',dur:d,start:end-d*MS,end,graceEnd:end+GRACE*MS,user:u,owner:'demo'});log.push({t:end-d*MS,d,m:Mi(id)});
  });
  mk(3).queue=[{name:U(6),client:'demo'},{name:U(9),client:'demo'}];   // Machine 3: 2 waiting
  mk(5).queue=[{name:U(7),client:'demo'}];                              // Machine 5: 1 waiting
  mk(13).queue=[{name:U(3),client:'demo'},{name:U(0),client:'demo'}];  // Machine 13: 2 waiting
  // usage pattern: quiet mornings, lunch bump 12–2 PM, big evening peak 6–10 PM, ~zero late night
  const w=[.3,.1,0,0,0,0,1,1.6,1.8,1.2,1,1.4,3.6,4.2,3.2,1.6,1.8,2.8,6,8.4,9,7.6,4.6,1.4];
  const durs=[30,40,40,60,45,30,40,60,90,40];
  for(let d=0;d<7;d++){const weekend=[0,6].includes(new Date(now-d*864e5).getDay());
    for(let h=0;h<24;h++){const n=Math.max(0,Math.round(w[h]*(weekend?1.25:1)*(0.75+Math.random()*0.5)));
      for(let k=0;k<n;k++){const day=new Date(now);day.setDate(day.getDate()-d);day.setHours(h,Math.floor(Math.random()*60),0,0);
        if(day.getTime()<now-90*MS)log.push({t:day.getTime(),d:durs[(h+k+d)%durs.length],m:1+Math.floor(Math.random()*N)})}}}
  const slot=mins=>{const t=new Date(now+mins*MS);t.setMinutes(Math.ceil(t.getMinutes()/15)*15,0,0);return t.getTime()};
  const bookings=[{id:'b1',mid:Mi(6),start:slot(75),dur:40,name:U(7),client:'demo',state:'upcoming'},
                  {id:'b2',mid:Mi(11),start:slot(140),dur:60,name:U(8),client:'demo',state:'upcoming'}];
  // open maintenance reports (lower those machines' health score)
  const reports=[{id:'r1',mid:Mi(7),issue:'Making unusual noise',details:'Loud rattling during spin',t:now-26*3600e3,by:U(4),cleared:false},
                 {id:'r2',mid:Mi(12),issue:'Not draining',details:'Water left in drum after cycle',t:now-5*3600e3,by:U(2),cleared:false},
                 {id:'r3',mid:Mi(4),issue:'Door won\'t lock',details:'',t:now-3*864e5,by:U(9),cleared:true,clearedAt:now-2*864e5}];
  const sharePool=[{client:'demo',name:U(1),t:now-4*MS}];   // someone open to sharing a load right now
  return{machines:m,log,bookings,reports,sharePool,nextId:N+1};
}
// ----- hostel blocks: each block has its own machine set, persisted separately -----
const BLOCKS={A:{n:12,o:3},B:{n:10,o:6},C:{n:15,o:0}};
let BLOCK=prefs.block in BLOCKS?prefs.block:'C';
{const qm=(new URLSearchParams(location.search).get('machine_id')||'').toUpperCase().match(/^WM-([A-C])\d/);if(qm)BLOCK=qm[1];else if(/^WM-\d/.test((new URLSearchParams(location.search).get('machine_id')||'').toUpperCase()))BLOCK='C'}
const skey=b=>b==='C'?KEY:KEY+'.'+b;
function loadBlock(b){const s=JSON.parse(localStorage.getItem(skey(b))||'null')||seed(b);s.bookings=s.bookings||[];s.reports=s.reports||[];s.sharePool=s.sharePool||[];return s}
let S=loadBlock(BLOCK);
const save=()=>localStorage.setItem(skey(BLOCK),JSON.stringify(S));save();
window.addEventListener('storage',e=>{if(e.key===skey(BLOCK)&&e.newValue){S=loadBlock(BLOCK);lastKey='';render()}});
const M=id=>S.machines.find(x=>x.id===id);

// ---------- sound / notifications ----------
let actx;
function beep(times=3){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
  for(let i=0;i<times;i++){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i%2?660:880;
    g.gain.setValueAtTime(.0001,t0+i*.35);g.gain.exponentialRampToValueAtTime(.3,t0+i*.35+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i*.35+.28);
    o.connect(g).connect(actx.destination);o.start(t0+i*.35);o.stop(t0+i*.35+.3)}}catch(e){}}
document.addEventListener('pointerdown',()=>{try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}},{once:true});
function askPermission(){if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}
// n = {type,title,body,mid} → also recorded in the notification center (bell); toast/sound/system notification unchanged
function notify(title,body,n){beep();toast(title+' — '+body);
  try{n=n||{};pushNote(n.type||'confirm',n.title||title,n.body||body,n.mid)}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body,tag:'washq-'+title});n.onclick=()=>{window.focus();n.close()}}}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);}
let toastT;
function toast(msg){let el=$('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),4200)}

// ---------- helpers ----------
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/(prefs.demo?1000/60:1000));const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;return(h?h+':'+String(mm).padStart(2,'0'):mm)+':'+String(ss).padStart(2,'0')}
const minsLeft=ms=>Math.max(1,Math.ceil(ms/MIN()));
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function range(b){const s=tm(b.start),e=tm(b.start+b.dur*60000);const day=new Date(b.start).toDateString()===new Date().toDateString()?'':' (tomorrow)';return s.replace(/\s?[AP]M$/i,m=>(s.slice(-2)===e.slice(-2)?'':m))+'–'+e+day}
const activeBooking=m=>S.bookings.find(b=>b.mid===m.id&&(b.state==='pending'||b.state==='confirmed'));
const nextBooking=m=>S.bookings.filter(b=>b.mid===m.id&&b.state==='upcoming').sort((a,b)=>a.start-b.start)[0];
const holdValid=m=>m.hold&&m.hold.until>Date.now();
function info(m){
  const now=Date.now();
  if(m.state==='busy'){const p=Math.min(100,(now-m.start)/(m.end-m.start)*100);return{cls:'busy',label:`Busy · ${minsLeft(m.end-now)} min left`,pct:p,left:m.end-now}}
  if(m.state==='done')return{cls:'done',label:'Cycle Complete · Collect Now',pct:100,left:m.graceEnd-now};
  const b=activeBooking(m);
  if(b)return{cls:'hold',label:b.state==='pending'?'Reserved · Awaiting check-in':'Reserved · Unlocking',pct:0,left:b.confirmBy-now,owner:b.client,b};
  if(holdValid(m))return{cls:'hold',label:'Reserved · Unlocking',pct:0,left:m.hold.until-now,owner:m.hold.client};
  return{cls:'free',label:'Free',pct:0,left:0};
}
const isFree=m=>info(m).cls==='free';
const inQueue=m=>m.queue.some(q=>q.client===ME);
const qpos=m=>m.queue.findIndex(q=>q.client===ME)+1;
// latest end allowed for a wash starting now, given other people's bookings
function limitFor(m,exceptBid){const n=S.bookings.filter(b=>b.mid===m.id&&b.id!==exceptBid&&b.state==='upcoming'&&b.client!==ME).sort((a,b)=>a.start-b.start)[0];return n?n.start:Infinity}

// ---------- engine ----------
function freeMachine(m){
  const q=m.queue.slice(),first=q.shift();reset(m);m.queue=q;
  if(first&&first.client===ME)notify(`${m.name} is free`,`You were first in line${first.name?' ('+first.name+')':''}. Head over now!`,{type:'queue',title:'It’s your turn',body:`${m.name} is now free — you were next in the queue.`,mid:m.id});
}
function releaseBooking(b,reason){
  S.bookings=S.bookings.filter(x=>x.id!==b.id);
  if(b.sid&&b.client===ME&&API.ok&&!b.unlocked)api('DELETE','/api/bookings/'+b.sid).catch(()=>{});
  const m=M(b.mid);if(!m)return;
  if(b.client===ME&&reason==='noshow')notify(`Slot released · ${m.name}`,`You didn't check in within ${CONFIRM} minutes, so your booking was cancelled.`,{type:'released',title:'Slot released',body:`Your slot on ${m.name} was released since it wasn’t confirmed in time.`,mid:m.id});
  if(m.hold&&m.hold.bookingId===b.id)m.hold=null;
  if(m.state==='free'){const first=m.queue.shift();if(first&&first.client===ME)notify(`${m.name} is available`,'A booked slot was released and you were first in line. Head over now!',{type:'queue',title:'It’s your turn',body:`${m.name} is now free — a booked slot was released and you were next in the queue.`,mid:m.id})}
  if(openConfirm===b.id)closeModal();
}
function tick(){
  const now=Date.now();let changed=false;
  for(const m of S.machines){
    if(m.sensor)continue; // machine 1 driven by live sensor when available
    if(m.state==='busy'&&now>=m.end){m.state='done';m.graceEnd=m.end+GRACE*MIN();changed=true;
      if(m.owner===ME)notify(`${m.name}: Cycle complete`,`${m.user?m.user.split('·')[0].trim()+', your':'Your'} laundry is ready. Please collect it within ${GRACE} minutes.`,{type:'done',title:`${m.name} is ready!`,body:`Your wash cycle finished — please collect your clothes within ${GRACE} min.`,mid:m.id})}
    if(m.state==='done'&&now>=m.graceEnd){freeMachine(m);changed=true}
  }
  for(const m of S.machines)if(m.hold&&m.hold.until<=now&&!m.hold.bookingId){m.hold=null;changed=true;if(otpFor===m.id)closeModal(),toast('Reservation expired — code not entered in time')}
  for(const b of S.bookings.slice()){
    if(!M(b.mid)){S.bookings=S.bookings.filter(x=>x!==b);changed=true;continue}
    if(b.state==='upcoming'&&now>=b.start){b.state='pending';b.confirmBy=b.start+CONFIRM*MIN();changed=true;
      if(b.client===ME){notify(`Your slot on ${M(b.mid).name} has started`,`Confirm within ${CONFIRM} minutes or your slot will be released.`,{type:'confirm',title:'Confirm your booking',body:`Confirm your ${new Date(b.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} slot on ${M(b.mid).name} within ${CONFIRM} minutes.`,mid:b.mid});confirmDialog(b.id)}}
    else if((b.state==='pending'||b.state==='confirmed')&&now>=b.confirmBy){releaseBooking(b,'noshow');changed=true}
  }
  if(changed){save();lastKey=''}
  render(true);tickModal();
}

// ---------- live sensor (Machine 1) ----------
// Polls sensor/machine1.json → {"state":"busy","remaining_min":23,"total_min":40} or {"state":"free"}.
// If the file/endpoint isn't reachable, Machine 1 silently falls back to simulation.
async function pollSensor(){
  const m=M(1);if(!m||BLOCK!=='C')return;  // real sensor is installed on Block C · Machine 1
  try{
    const r=await fetch('sensor/machine1.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const d=await r.json(),now=Date.now();
    if(!m.sensor){m.sensor=true;lastKey=''}
    if(d.state==='busy'){const tot=(d.total_min||m.dur||40)*MIN(),end=now+(d.remaining_min||0)*MIN();
      if(m.state!=='busy')Object.assign(m,{state:'busy',dur:d.total_min||40,start:end-tot,user:m.user||'Sensor detected',owner:m.owner||''});
      m.end=end;}
    else if(d.state==='free'&&m.state==='busy'){m.state='done';m.graceEnd=now+GRACE*MIN();if(m.owner===ME)notify(`${m.name}: Cycle complete`,'Sensor reports your wash is finished.',{type:'done',title:`${m.name} is ready!`,body:`Sensor reports your wash cycle finished — please collect your clothes within ${GRACE} min.`,mid:m.id})}
    else if(d.state==='free'&&m.state==='done'&&now>=m.graceEnd)freeMachine(m);
    save();
  }catch(e){if(m.sensor){m.sensor=false;save();lastKey=''}}
}

// ---------- routing ----------
let route='home',param=null,lastKey='';
function parseRoute(){
  const pm=location.pathname.match(/\/machine\/(\d+)\/?$/);
  if(pm&&!location.hash){location.replace(location.pathname.replace(/\/machine\/\d+\/?$/,'/')+'#/machine/'+pm[1]);return}
  const h=location.hash.replace(/^#/,'')||'/';let mm;
  if((mm=h.match(/^\/machine\/(\d+)/))){route='machine';param=+mm[1]}
  else if(h.startsWith('/setup'))route='setup';
  else if(h.startsWith('/admin'))route='admin';
  else route='home';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.r===route||(route==='machine'&&a.dataset.r==='home')));
  $('#gear').style.color=route==='setup'?'var(--primary)':'';
  lastKey='';render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',parseRoute);

// ---------- UI pieces ----------
const ic={
  bell:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  cal:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  scan:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>',
  people:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9"/></svg>'
};
function queueBtn(m){return inQueue(m)?`<button class="btn tonal" data-act="unqueue" data-id="${m.id}">✓ #${qpos(m)} in line · Leave</button>`
  :`<button class="btn outline" data-act="queue" data-id="${m.id}">${ic.bell}Notify me<span class="lg-only"> when free</span></button>`}
function actionsFor(m){

  if(i.cls==='hold'){
    if(i.owner===ME){
      if(i.b&&i.b.state==='pending')return`<button class="btn primary" data-act="checkin" data-id="${m.id}">Yes, I'm here</button>`;
      if(i.b&&i.b.sid)return`<button class="btn primary" data-act="scan" data-bid="${i.b.id}">${ic.scan}Scan QR to Unlock</button>`;
      return`<button class="btn primary" data-act="resume" data-id="${m.id}">${ic.lock}Enter unlock code</button>`;

  const h=health(m);t.push(`<span class="tag health h-${h.cls}" title="Predictive maintenance health score">${ic.pulse}Health ${h.score}% · ${h.label}</span>`);
  return`<div class="tags">${t.join('')}</div>`;

function machineURL(id){return location.origin+location.pathname.replace(/\/machine\/\d+\/?$/,'/')+'?machine_id='+mcode(id)+'#/machine/'+id}
function qrObj(t){const q=qrcode(0,'M');q.addData(t);q.make();return q}
const qrSVG=t=>qrObj(t).createSvgTag({cellSize:4,margin:0,scalable:true});
function downloadQR(m){
  const q=qrObj(machineURL(m.id)),n=q.getModuleCount(),cell=12,pad=48,size=n*cell,W=size+pad*2,H=W+80;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(pad+k*cell,pad+r*cell,cell,cell);
  x.textAlign='center';x.font='600 30px Inter,Segoe UI,Roboto,sans-serif';x.fillText('WashQ · '+m.name,W/2,W+18);
  x.font='18px Inter,Segoe UI,Roboto,sans-serif';x.fillStyle='#5f6368';x.fillText('Scan for live status & to reserve',W/2,W+50);
  const a=document.createElement('a');a.download=`washq-${m.name.replace(/\W+/g,'-').toLowerCase()}-qr.png`;a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
}

// ----- ambient background: tint follows the share of FREE machines (recomputed on every render) -----
const AMB={
  light:{busy:['#fdba74','#fca5a5','#fcd34d'],mixed:['#a5b4fc','#d8b4fe','#93c5fd'],free:['#6ee7b7','#5eead4','#a7f3d0']},
  dark: {busy:['#7c2d12','#6b1d2a','#713f12'],mixed:['#312e81','#4c1d95','#1e3a8a'],free:['#065f46','#115e59','#134e4a']}
};
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mixC=(a,b,t)=>'#'+hex2(a).map((v,i)=>Math.round(v+(hex2(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
let ambKey='';
function setMood(){
  const n=S.machines.length,free=S.machines.filter(isFree).length,pct=n?free/n:.5;
  const theme=document.documentElement.dataset.theme==='dark'?'dark':'light',P=AMB[theme];
  const key=theme+'|'+free+'/'+n;if(key===ambKey)return;ambKey=key;
  // 0% free → warm amber/red · 50% → neutral blue/purple · 100% free → green/teal
  const [from,to,t]=pct<.5?[P.busy,P.mixed,pct/.5]:[P.mixed,P.free,(pct-.5)/.5];
  const c=from.map((x,i)=>mixC(x,to[i],t)),r=document.documentElement.style;
  r.setProperty('--bg-gradient-start',c[0]);r.setProperty('--bg-gradient-mid',c[1]);r.setProperty('--bg-gradient-end',c[2]);
  const mood=pct>=.6?'free':(1-pct)>=.6?'busy':'mixed';document.documentElement.dataset.mood=mood;
  console.log(`[WashQ] ambient: ${free}/${n} machines free = ${Math.round(pct*100)}% → ${mood} (${theme}) start ${c[0]} end ${c[2]}`);
}

function closeModal(){$('#modal').innerHTML='';otpFor=null;openConfirm=null;modalTick=null}
function tickModal(){if(modalTick)modalTick()}
function showModal(html){$('#modal').innerHTML=`<div class="scrim" id="scrim"><div class="dialog">${html}</div></div>`;$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeModal()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function durOpts(limitMs,sel=40){
  const now=Date.now();
  let first=null;
  const html=DUR.map(o=>{const dis=now+o.v*MIN()>limitMs;if(!dis&&(first===null||o.v===sel))first=o.v;return{o,dis}})
    .map(({o,dis})=>`<label class="opt"><input type="radio" name="dur" value="${o.v}" ${dis?'disabled':''} ${o.v===first?'checked':''}><div><b>${o.t}</b><small>${dis?'Not available — machine booked soon':o.d}</small></div><span class="mins">${o.v} min</span></label>`).join('')+customOpt(first===null);
  return{html,any:true};
}
// ----- custom duration -----
const customOpt=checked=>`<label class="opt"><input type="radio" name="dur" value="custom" ${checked?'checked':''}><div><b>Custom Duration</b><small>Set your own time (1–180 min)</small></div><span class="mins">⋯</span></label>`;
const durField=(inner)=>`<div class="field"><label>Wash type</label><div class="opts" id="durOpts">${inner}</div>
  <div id="durCustom" class="custom-dur" hidden><div class="cd-row"><input type="number" id="durMin" step="any" inputmode="numeric" placeholder="e.g. 45" aria-label="Custom duration in minutes"><span>minutes</span></div>
  <div class="cd-chips">${[15,45,75,90,120].map(v=>`<button type="button" class="chip" data-cd="${v}">${v} min</button>`).join('')}</div>
  <button type="button" class="link" id="durBack">← Back to preset options</button></div></div>`;
function wireDur(){
  const opts=$('#durOpts'),box=$('#durCustom'),inp=$('#durMin');
  const show=on=>{opts.hidden=on;box.hidden=!on;if(on)setTimeout(()=>inp.focus(),30)};
  opts.querySelectorAll('input[name=dur]').forEach(r=>r.onchange=()=>show(r.value==='custom'&&r.checked));
  $('#durBack').onclick=()=>{const f=opts.querySelector('input[name=dur]:not([value=custom]):not(:disabled)');if(f)f.checked=true;show(false)};
  box.querySelectorAll('[data-cd]').forEach(c=>c.onclick=()=>{inp.value=c.dataset.cd;inp.classList.remove('bad')});
  inp.oninput=()=>inp.classList.remove('bad');
  const c=opts.querySelector('input[value=custom]');if(c&&c.checked)show(true);
}
// returns minutes, or null after showing an error in #msg
function readDur(limitMs){
  const r=document.querySelector('input[name=dur]:checked');const msg=$('#msg');
  const err=t=>{if(msg){msg.className='msg err';msg.textContent=t}else toast(t);const i=$('#durMin');if(i&&!$('#durCustom').hidden){i.classList.add('bad');i.focus()}return null};
  if(!r)return err('Choose a wash type.');
  let v;
  if(r.value==='custom'){const raw=$('#durMin').value.trim();v=Number(raw);
    if(raw===''||!Number.isFinite(v))return err('Enter a duration in minutes.');
    if(!Number.isInteger(v))return err('Use whole minutes only (e.g. 45).');
    if(v<1||v>180)return err('Duration must be between 1 and 180 minutes.');}
  else v=+r.value;
  if(limitMs!=null&&Date.now()+v*MIN()>limitMs)return err(`That would overlap the next booking. Choose ${Math.max(1,Math.floor((limitMs-Date.now())/MIN()))} minutes or less.`);
  return v;
}
const who=()=>[prefs.name,prefs.room].filter(Boolean).join(' · ');
const nameFields=()=>signedIn()?`<div class="as-user"><span class="avatar">${esc(initials(prefs.user))}</span><span><b>${esc(prefs.user.name||'You')}</b> · Room ${esc(prefs.user.room)}<small>Filled in from your account</small></span></div><input type="hidden" id="nm" value="${esc(prefs.user.name||prefs.name||'')}"><input type="hidden" id="rm" value="${esc(prefs.user.room)}">`:`<div class="row"><div class="field" style="flex:1.4"><label>Name (optional)</label><input id="nm" maxlength="24" placeholder="e.g. Aarav" value="${esc(prefs.name||'')}"></div><div class="field" style="flex:1"><label>Room</label><input id="rm" maxlength="8" placeholder="B-204" value="${esc(prefs.room||'')}"></div></div>`;
const readName=()=>{prefs.name=$('#nm').value.trim();prefs.room=$('#rm').value.trim();savePrefs()};

// Step 1: choose cycle → Step 2: OTP
function reserveDialog(id){
  const m=M(id);if(!isFree(m)){toast('This machine is no longer free');return}
  const d=durOpts(limitFor(m));
  showModal(`<form id="f"><h2>Reserve ${esc(m.name)}</h2><p>Pick a cycle. You’ll get a one-time code to confirm you’re at the machine.</p>
    ${durField(d.html)}
    ${nameFields()}
    <label class="switch share-sw"><input type="checkbox" id="shareOk" ${prefs.share?'checked':''}><span class="track"></span><span>Open to sharing this load with someone else doing laundry now <small>(optional)</small></span></label>
    <div class="msg err" id="msg"></div>
    <div class="actions"><button type="button" class="btn tonal" data-close>Cancel</button><button class="btn primary">Reserve &amp; get code</button></div></form>`);
  $('[data-close]').onclick=closeModal;wireDur();
  $('#f').onsubmit=e=>{e.preventDefault();askPermission();readName();
    if(!isFree(m)){closeModal();toast('Someone just reserved this machine');return}
    const dur=readDur(limitFor(m));if(dur==null)return;
    const share=$('#shareOk').checked;prefs.share=share;savePrefs();
    m.hold={client:ME,until:Date.now()+HOLD*MIN(),dur,user:who(),code:newCode(),tries:0,share};save();lastKey='';render();
    if(share)findShareMatch(m);
    checklistDialog(m,()=>otpDialog(id))};
}
const newCode=()=>String(Math.floor(1000+Math.random()*9000));
function otpDialog(id){
  const m=M(id),h=m.hold;if(!h||h.client!==ME){toast('Reservation not found');return}
  otpFor=id;
  showModal(`<h2>Unlock ${esc(m.name)}</h2><p style="margin-bottom:12px">${durName(h.dur)} · ${h.dur} min${h.bookingId?' · booked slot':''}</p>
    <div class="otp-show" id="code">${h.code}</div>
    <div class="otp-hint">Enter this code at the machine to confirm and start your wash</div>
    <div class="otp-in" id="boxes">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" autocomplete="one-time-code">`).join('')}</div>
    <div class="msg" id="msg"></div>
    <div class="sub" style="text-align:center;font-size:12px;margin-bottom:10px">Reservation held for <span id="hl">${fmt(h.until-Date.now())}</span></div>
    <div class="actions"><button class="btn tonal" data-act="release" data-id="${id}">Release</button><button class="btn tonal" id="regen" style="display:none">Generate new code</button><button class="btn primary" id="ok">Confirm &amp; start</button></div>
    <div class="sub" style="font-size:11.5px;text-align:center;margin-top:14px">In the hardware version this code is typed on the keypad mounted on the machine.</div>`);
  const boxes=[...document.querySelectorAll('#boxes input')];
  boxes.forEach((b,i)=>{
    b.oninput=()=>{b.value=b.value.replace(/\D/g,'').slice(-1);if(b.value&&i<3)boxes[i+1].focus();if(boxes.every(x=>x.value))verify()};
    b.onkeydown=e=>{if(e.key==='Backspace'&&!b.value&&i>0)boxes[i-1].focus();if(e.key==='Enter')verify()};
    b.onpaste=e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(t){e.preventDefault();t.split('').forEach((c,j)=>boxes[j].value=c);(boxes[t.length]||boxes[3]).focus();if(t.length===4)verify()}};
  });
  setTimeout(()=>boxes[0].focus(),60);
  const msg=$('#msg');
  const lock=on=>{boxes.forEach(b=>b.disabled=on);$('#ok').style.display=on?'none':'';$('#regen').style.display=on?'':'none'};
  if(h.tries>=2){msg.className='msg err';msg.textContent='Too many incorrect attempts. Generate a new code to try again.';lock(true)}
  function verify(){
    const v=boxes.map(b=>b.value).join('');if(v.length<4){msg.className='msg err';msg.textContent='Enter all 4 digits';return}
    if(v===h.code){startWash(m,h.dur,h.user,h.bookingId);closeModal();toast(`${m.name} unlocked · ${h.dur} min ${durName(h.dur).toLowerCase()} started`);return}
    h.tries++;save();
    const bx=$('#boxes');bx.classList.remove('err');void bx.offsetWidth;bx.classList.add('err');
    boxes.forEach(b=>b.value='');
    if(h.tries>=2){msg.className='msg err';msg.textContent='Incorrect code entered twice. Please generate a new code and try again.';lock(true)}
    else{msg.className='msg err';msg.textContent='Incorrect code — 1 attempt left';boxes[0].focus()}
  }
  $('#ok').onclick=verify;
  $('#regen').onclick=()=>{h.code=newCode();h.tries=0;save();$('#code').textContent=h.code;$('#code').style.animation='none';void $('#code').offsetWidth;$('#code').style.animation='';msg.className='msg';msg.textContent='New code generated';lock(false);boxes[0].focus()};
  modalTick=()=>{const hh=M(id)&&M(id).hold;const el=$('#hl');if(hh&&el)el.textContent=fmt(hh.until-Date.now())};
}
function startWash(m,dur,user,bid){
  if(m.state!=='free'){toast('Machine is still in use');return}
  const now=Date.now();Object.assign(m,{state:'busy',dur,start:now,end:now+dur*MIN(),user:user||'',owner:ME,hold:null});
  if(bid)S.bookings=S.bookings.filter(b=>b.id!==bid);
  S.log.push({t:now,d:dur,m:m.id,u:ME});save();lastKey='';render();
}

function bookDialog(id){
  const m=M(id);
  const d=new Date(Date.now()+30*60000);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);
  const hhmm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  showModal(`<form id="f"><h2>Book ${esc(m.name)}</h2><p>You’ll get ${CONFIRM} minutes to check in when your slot starts, or it’s released to the next person.</p>
    <div class="field"><label>Start time</label><input type="time" id="st" value="${hhmm}" required></div>
    ${durField(DUR.map(o=>`<label class="opt"><input type="radio" name="dur" value="${o.v}" ${o.v===40?'checked':''}><div><b>${o.t}</b><small>${o.d}</small></div><span class="mins">${o.v} min</span></label>`).join('')+customOpt(false))}
    ${nameFields()}
    <div class="msg err" id="msg"></div>
    <div class="actions"><button type="button" class="link" id="quick" style="margin-right:auto">Test: slot in 1 min</button><button type="button" class="btn tonal" data-close>Cancel</button><button class="btn primary">Book slot</button></div></form>`);
  $('[data-close]').onclick=closeModal;wireDur();
  const submit=(startMs)=>{
    const dur=readDur(null);if(dur==null)return;const end=startMs+dur*60000;
    const clash=S.bookings.find(b=>b.mid===id&&startMs<b.start+b.dur*60000&&b.start<end);
    if(clash){$('#msg').textContent=`Overlaps an existing booking (${range(clash)}). Pick another time.`;return}
    if(S.bookings.some(b=>b.client===ME&&b.state==='upcoming'&&b.mid===id&&Math.abs(b.start-startMs)<3600000)){$('#msg').textContent='You already have a booking near this time on this machine.';return}
    readName();askPermission();
    const b={id:'b'+Date.now().toString(36),mid:id,start:startMs,dur,name:who(),client:ME,state:'upcoming'};
    const finish=()=>{S.bookings.push(b);save();lastKey='';render();if(b.sid)bookingConfirmed(b);else{closeModal();toast(`Booked ${m.name} · ${range(b)}`)}};
    if(!API.ok)return finish();
    const go=async()=>{
      const btn=document.querySelector('#f button.primary');if(btn){btn.disabled=true;btn.textContent='Booking…'}
      try{const r=await api('POST','/api/bookings',{machine_id:mcode(id),machine_name:m.name,start:startMs,dur});b.sid=r.booking.id;b.pin=r.pin;finish()}
      catch(e){if(btn){btn.disabled=false;btn.textContent='Book slot'}if(e.status===401)return loginDialog(()=>bookDialog(id));const el=$('#msg');if(el)el.textContent=e.message;else toast(e.message)}
    };
    if(!prefs.token)return loginDialog(()=>{bookDialog(id)},'Sign in to book a slot');
    go();
  };
  $('#f').onsubmit=e=>{e.preventDefault();const [h,mi]=$('#st').value.split(':').map(Number);const t=new Date();t.setHours(h,mi,0,0);if(t.getTime()<=Date.now())t.setDate(t.getDate()+1);submit(t.getTime())};
  $('#quick').onclick=()=>submit(Date.now()+60000);
}

function confirmDialog(bid){
  const b=S.bookings.find(x=>x.id===bid);if(!b)return;const m=M(b.mid);
  if(b.state==='confirmed'){if(b.sid){startUnlock(b);return}openOtpForBooking(b);return}
  openConfirm=bid;
  showModal(`<h2>Are you going to use ${esc(m.name)} now?</h2>
    <p>Your booked slot (${range(b)}) has started. Confirm within ${CONFIRM} minutes or your slot will be released.</p>
    <div class="countdown" id="cd">${fmt(b.confirmBy-Date.now())}</div>
    <div class="ring-bar"><i id="cdb" style="width:100%"></i></div>
    <div class="actions"><button class="btn tonal" data-act="unbook" data-bid="${b.id}">Release slot</button><button class="btn tonal" id="later">Later</button><button class="btn primary" id="yes">Yes, I'm here</button></div>`);
  const upd=()=>{const bb=S.bookings.find(x=>x.id===bid);if(!bb)return;const left=bb.confirmBy-Date.now();$('#cd')&&($('#cd').textContent=fmt(left));$('#cdb')&&($('#cdb').style.width=Math.max(0,left/(CONFIRM*MIN())*100)+'%')};
  upd();modalTick=upd;
  $('#later').onclick=closeModal;
  $('#yes').onclick=()=>{
    if(M(b.mid).state!=='free'){toast(`${m.name} is still finishing a cycle — try again in a moment`);return}
    b.state='confirmed';b.confirmBy=Date.now()+CONFIRM*MIN();
    if(b.sid){const mm=M(b.mid);mm.hold={client:ME,until:b.confirmBy,dur:b.dur,user:b.name,bookingId:b.id,qr:true};save();lastKey='';render();closeModal();startUnlock(b);return}
    openOtpForBooking(b);
  };
}
function openOtpForBooking(b){
  const m=M(b.mid);
  if(!m.hold||m.hold.bookingId!==b.id)m.hold={client:ME,until:b.confirmBy,dur:b.dur,user:b.name,code:newCode(),tries:0,bookingId:b.id};
  save();lastKey='';render();otpDialog(m.id);
}

// ---------- actions ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const id=+el.dataset.id,m=M(id);
  switch(el.dataset.act){
    case'reserve':reserveDialog(id);break;
    case'quickscan':quickScan();break;
    case'report':reportDialog(id);break;
    case'resolve':{const r=S.reports.find(x=>x.id===el.dataset.rid);if(r){r.cleared=true;r.clearedAt=Date.now();save();lastKey='';render();toast(`Issue on ${M(r.mid)?M(r.mid).name:'machine'} marked as resolved`)}break}
    case'green':greenInfo();break;
    case'share-no':prefs.shareMatch=null;savePrefs();banners();break;
    case'share-yes':{const sm=prefs.shareMatch;prefs.shareMatch=null;savePrefs();banners();toast(`Suggestion sent to ${sm?sm.first:'them'} — they'll see your machine number`);break}
    case'scan':{const b=S.bookings.find(x=>x.id===el.dataset.bid);if(b)startUnlock(b);break}
    case'resume':otpDialog(id);break;
    case'checkin':{const b=activeBooking(m);if(b&&b.client===ME)confirmDialog(b.id);break}
    case'release':if(m.hold){const bid=m.hold.bookingId;m.hold=null;if(bid){const b=S.bookings.find(x=>x.id===bid);if(b)releaseBooking(b,'user')}save();closeModal();lastKey='';render();toast('Reservation released')}break;
    case'book':bookDialog(id);break;
    case'unbook':{const b=S.bookings.find(x=>x.id===el.dataset.bid);if(b&&confirm('Cancel this booking?')){releaseBooking(b,'user');save();closeModal();lastKey='';render();toast('Booking cancelled')}break}
    case'queue':showModal(`<form id="f"><h2>Notify me · ${esc(m.name)}</h2><p>You’ll get an alert when it’s free. First in line is notified first.</p><div class="field"><label>Name / room (optional)</label><input id="qn" maxlength="30" value="${esc(who())}" placeholder="e.g. Aarav · B-204"></div><div class="actions"><button type="button" class="btn tonal" data-close>Cancel</button><button class="btn primary">Join queue</button></div></form>`);
      $('[data-close]').onclick=closeModal;
      $('#f').onsubmit=ev=>{ev.preventDefault();askPermission();if(!inQueue(m))m.queue.push({name:$('#qn').value.trim(),client:ME,t:Date.now()});save();closeModal();lastKey='';render();toast(`You’re #${qpos(m)} in line for ${m.name}`)};break;
    case'unqueue':m.queue=m.queue.filter(q=>q.client!==ME);save();lastKey='';render();toast('Left the queue');break;
    case'cancel':if(confirm(`Cancel your wash on ${m.name}?`)){S.log=S.log.filter(l=>!(l.m===id&&l.t===m.start));freeMachine(m);save();lastKey='';render()}break;
    case'collect':freeMachine(m);save();lastKey='';render();toast(`Thanks! ${m.name} is now free`);break;
    case'dl':downloadQR(m);break;
    case'del':if(confirm(`Delete ${m.name}? Its QR code will stop working and any bookings are cancelled.`)){S.machines=S.machines.filter(x=>x.id!==id);S.bookings=S.bookings.filter(b=>b.mid!==id);if(justMade===id)justMade=null;save();lastKey='';render();toast(`${m.name} deleted`)}break;
  }
});

/*UNLOCK_JS*/
initBlockSel();
parseRoute();
setInterval(tick,1000);
initApi();
pollSensor();setInterval(pollSensor,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
// reopen my pending check-in popup on load
setTimeout(()=>{const b=S.bookings.find(x=>x.client===ME&&x.state==='pending');if(b&&!$('#scrim'))confirmDialog(b.id)},400);
})();
</script>
